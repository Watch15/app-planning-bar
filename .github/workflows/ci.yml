name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node -c server.js
          node -c public/script.js
          node -c scripts/init-db.js

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run tests
        run: npm test

  # CD-01 — Le déploiement gardé par la CI est assuré côté Railway, pas ici.
  #
  # Chaque service Railway DOIT avoir le réglage « Wait for CI » activé : Railway attend
  # que le check GitHub de ce workflow soit vert avant de lancer son déploiement. Un
  # commit qui casse le lint ou les tests n'est donc jamais déployé, sur AUCUN des
  # environnements — Dev, Demo, Prod et le fork client `Castaniu Family`.
  #
  # ⚠️ Au 2026-09-10 ce n'est VRAI que pour `Castaniu Family`. Les trois instances
  # internes ont encore `checkSuites: false` et déploient sans attendre la CI — c'est
  # ce qui a laissé passer les commits rouges des 09 et 10/09 en prod interne. Bascule
  # volontairement différée (décision du 2026-09-10), à faire par `railway api` :
  #   mutation { deploymentTriggerUpdate(id: "<trigger>", input: { checkSuites: true }) }
  # Triggers : Prod ef6cc85c… · Demo 53d0648e… · Dev c8cceb89…  (lecture :
  # `deploymentTriggers(projectId, environmentId, serviceId)`). Un trigger RECRÉÉ
  # (renommage de service, dépôt reconnecté) repasse à `false` en silence : le relire
  # avant d'affirmer qu'une garde existe.
  #
  # Il y a donc UN SEUL chemin de déploiement (le webhook GitHub de Railway). Ne pas
  # rajouter ici un job `railway up` : ça redéploierait une seconde fois le même
  # service, en concurrence avec le déploiement automatique.
  #
  # Piège à connaître si on revient un jour sur ce choix : le service `Dev`
  # (bb14c37f) est PARTAGÉ par les trois environnements Prod / Demo / Dev. Son seul
  # nom ne désigne donc pas une cible — c'est l'environnement auquel le token est
  # scopé qui tranche. Un `railway up --service Dev` sans `--environment` explicite
  # peut déployer dev.templyo.fr en croyant livrer la prod.
